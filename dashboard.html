<style>
    .stat-card { color: white; border-radius: 8px; padding: 25px; margin-bottom: 20px; }
    .stat-card h5 { margin: 0; font-size: 16px; opacity: 0.9; }
    .stat-card h2 { margin: 10px 0 0; font-size: 36px; }
    .stat-card small { opacity: 0.8; }
</style>

<h3 class="mb-4"><i class="fas fa-chart-line"></i> Dashboard</h3>

<div class="row">
    <div class="col-md-4">
        <div class="stat-card bg-primary">
            <h5>Total Leads</h5>
            <h2 id="totalLeads">0</h2>
            <small>All time</small>
        </div>
    </div>
    <div class="col-md-4">
        <div class="stat-card bg-success">
            <h5>Active Leads</h5>
            <h2 id="activeLeads">0</h2>
            <small>Not converted/lost</small>
        </div>
    </div>
    <div class="col-md-4">
        <div class="stat-card bg-warning">
            <h5>Converted</h5>
            <h2 id="convertedLeads">0</h2>
            <small>Successfully converted</small>
        </div>
    </div>
</div>

<div class="row mt-4">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header"><h5 class="mb-0">Lead Status Distribution</h5></div>
            <div class="card-body">
                <canvas id="statusChart"></canvas>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card">
            <div class="card-header"><h5 class="mb-0">Recent Leads</h5></div>
            <div class="card-body">
                <ul class="list-group" id="recentLeads"></ul>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
(async function() {
    const { data: { user } } = await window.supabase.auth.getUser();
    if (!user) return;
    
    const { data: leads } = await window.supabase
        .from('leads')
        .select('*')
        .eq('user_id', user.id)
        .order('created_at', { ascending: false });
    
    if (leads) {
        document.getElementById('totalLeads').textContent = leads.length;
        document.getElementById('activeLeads').textContent = leads.filter(l => l.status !== 'Converted' && l.status !== 'Lost').length;
        document.getElementById('convertedLeads').textContent = leads.filter(l => l.status === 'Converted').length;
        
        // Recent leads
        const recent = leads.slice(0, 5);
        document.getElementById('recentLeads').innerHTML = recent.map(lead => `
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <div>
                    <strong>${lead.name}</strong>
                    <br><small class="text-muted">${lead.phone}</small>
                </div>
                <span class="badge bg-${lead.status === 'Converted' ? 'success' : lead.status === 'Lost' ? 'danger' : 'primary'}">${lead.status}</span>
            </li>
        `).join('');
        
        // Chart
        const statuses = ['New', 'Contacted', 'Interested', 'Converted', 'Lost'];
        const counts = statuses.map(s => leads.filter(l => l.status === s).length);
        
        new Chart(document.getElementById('statusChart'), {
            type: 'doughnut',
            data: {
                labels: statuses,
                datasets: [{
                    data: counts,
                    backgroundColor: ['#1976d2', '#f57c00', '#7b1fa2', '#388e3c', '#d32f2f']
                }]
            }
        });
    }
})();
</script>
