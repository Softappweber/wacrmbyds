<style>
    .quick-reply-card {
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 10px;
        cursor: pointer;
        transition: all 0.2s;
        border-left: 3px solid #25D366;
        background: #f8f9fa;
    }
    .quick-reply-card:hover {
        background: #f0fff4;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .quick-reply-text {
        font-size: 13px;
        color: #555;
    }
    .quick-reply-actions {
        display: flex;
        gap: 5px;
    }
</style>

<div class="d-flex justify-content-between mb-3">
    <h3><i class="fas fa-bolt"></i> Quick Replies</h3>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addQuickReplyModal">
        <i class="fas fa-plus"></i> Add Quick Reply
    </button>
</div>

<div class="alert alert-info">
    <i class="fas fa-info-circle"></i> 
    Quick replies are saved messages you can insert with one click. Saves time typing common responses.
</div>

<div id="quickRepliesList"></div>

<!-- Add Quick Reply Modal -->
<div class="modal fade" id="addQuickReplyModal"><div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5>Add Quick Reply</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
        <div class="mb-3">
            <label class="form-label">Title *</label>
            <input type="text" id="quickReplyTitle" class="form-control" placeholder="e.g., Price Inquiry Response">
        </div>
        <div class="mb-3">
            <label class="form-label">Category</label>
            <input type="text" id="quickReplyCategory" class="form-control" placeholder="e.g., Sales, Support, Greeting">
        </div>
        <div class="mb-3">
            <label class="form-label">Message *</label>
            <textarea id="quickReplyMessage" class="form-control" rows="4" placeholder="Type your quick response..."></textarea>
        </div>
    </div>
    <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" onclick="addQuickReply()">Save</button>
    </div>
</div></div></div>

<script>
async function loadQuickReplies() {
    const { data: { user } } = await window.supabase.auth.getUser();
    if (!user) return;
    
    const { data: replies } = await window.supabase
        .from('quick_replies')
        .select('*')
        .eq('user_id', user.id)
        .order('created_at', { ascending: false });
    
    if (replies && replies.length > 0) {
        document.getElementById('quickRepliesList').innerHTML = replies.map(reply => `
            <div class="quick-reply-card">
                <div class="d-flex justify-content-between align-items-start">
                    <div>
                        <strong>${reply.title}</strong>
                        <span class="badge bg-secondary ms-2">${reply.category || 'General'}</span>
                        <p class="quick-reply-text mt-2 mb-2">${reply.message}</p>
                    </div>
                    <div class="quick-reply-actions">
                        <button class="btn btn-sm btn-success" onclick="copyQuickReply('${reply.message.replace(/'/g, "\\'")}')">
                            <i class="fas fa-copy"></i>
                        </button>
                        <button class="btn btn-sm btn-danger" onclick="deleteQuickReply(${reply.id})">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            </div>
        `).join('');
    } else {
        document.getElementById('quickRepliesList').innerHTML = `
            <div class="text-center py-5">
                <i class="fas fa-bolt fa-3x text-muted mb-3"></i>
                <h5>No quick replies yet</h5>
                <p class="text-muted">Create your first quick reply to save time</p>
            </div>
        `;
    }
}

window.addQuickReply = async function() {
    const { data: { user } } = await window.supabase.auth.getUser();
    if (!user) return;
    
    const { error } = await window.supabase.from('quick_replies').insert([{
        user_id: user.id,
        title: document.getElementById('quickReplyTitle').value,
        category: document.getElementById('quickReplyCategory').value,
        message: document.getElementById('quickReplyMessage').value
    }]);
    
    if (error) { alert(error.message); } else {
        $('#addQuickReplyModal').modal('hide');
        loadQuickReplies();
    }
};

window.copyQuickReply = function(text) {
    navigator.clipboard.writeText(text).then(() => {
        alert('Copied to clipboard!');
    });
};

window.deleteQuickReply = async function(id) {
    if (confirm('Delete this quick reply?')) {
        await window.supabase.from('quick_replies').delete().eq('id', id);
        loadQuickReplies();
    }
};

loadQuickReplies();
</script>
