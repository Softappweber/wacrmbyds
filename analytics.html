<style>
    .analytics-card {
        border-radius: 10px;
        padding: 20px;
        margin-bottom: 20px;
    }
    .chart-container {
        position: relative;
        height: 300px;
        margin-bottom: 20px;
    }
    .metric-value {
        font-size: 28px;
        font-weight: bold;
    }
    .metric-label {
        font-size: 14px;
        opacity: 0.8;
    }
    .trend-up {
        color: #388e3c;
    }
    .trend-down {
        color: #d32f2f;
    }
</style>

<h3 class="mb-4"><i class="fas fa-chart-bar"></i> Analytics</h3>

<!-- Key Metrics -->
<div class="row">
    <div class="col-md-3">
        <div class="card analytics-card bg-primary text-white">
            <div class="metric-value" id="totalLeadsMetric">0</div>
            <div class="metric-label">Total Leads</div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card analytics-card bg-success text-white">
            <div class="metric-value" id="conversionRateMetric">0%</div>
            <div class="metric-label">Conversion Rate</div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card analytics-card bg-warning text-white">
            <div class="metric-value" id="messagesSentMetric">0</div>
            <div class="metric-label">Messages Sent</div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card analytics-card bg-info text-white">
            <div class="metric-value" id="followupsMetric">0</div>
            <div class="metric-label">Follow-ups</div>
        </div>
    </div>
</div>

<!-- Charts Row 1 -->
<div class="row">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header"><h5 class="mb-0">Lead Status Distribution</h5></div>
            <div class="card-body">
                <div class="chart-container">
                    <canvas id="statusChart"></canvas>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card">
            <div class="card-header"><h5 class="mb-0">Leads Growth (Last 7 Days)</h5></div>
            <div class="card-body">
                <div class="chart-container">
                    <canvas id="growthChart"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Charts Row 2 -->
<div class="row">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header"><h5 class="mb-0">Activity Breakdown</h5></div>
            <div class="card-body">
                <div class="chart-container">
                    <canvas id="activityChart"></canvas>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card">
            <div class="card-header"><h5 class="mb-0">Follow-up Status</h5></div>
            <div class="card-body">
                <div class="chart-container">
                    <canvas id="followupChart"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Top Leads -->
<div class="row">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header"><h5 class="mb-0">Top Converted Leads</h5></div>
            <div class="card-body">
                <div id="topLeadsList"></div>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card">
            <div class="card-header"><h5 class="mb-0">Recent Activity Summary</h5></div>
            <div class="card-body">
                <div id="activitySummary"></div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
let statusChartInstance = null;
let growthChartInstance = null;
let activityChartInstance = null;
let followupChartInstance = null;

async function loadAnalytics() {
    const { data: { user } } = await window.supabase.auth.getUser();
    if (!user) return;
    
    // Load leads
    const { data: leads } = await window.supabase
        .from('leads')
        .select('*')
        .eq('user_id', user.id);
    
    // Load activities
    const { data: activities } = await window.supabase
        .from('activity_log')
        .select('*')
        .eq('user_id', user.id);
    
    // Load followups
    const { data: followups } = await window.supabase
        .from('followups')
        .select('*')
        .eq('user_id', user.id);
    
    const totalLeads = leads?.length || 0;
    const convertedLeads = leads?.filter(l => l.status === 'Converted').length || 0;
    const conversionRate = totalLeads > 0 ? ((convertedLeads / totalLeads) * 100).toFixed(1) : 0;
    const messagesSent = activities?.filter(a => a.action.includes('WhatsApp') || a.action.includes('Bulk')).length || 0;
    const totalFollowups = followups?.length || 0;
    
    // Update metrics
    document.getElementById('totalLeadsMetric').textContent = totalLeads;
    document.getElementById('conversionRateMetric').textContent = conversionRate + '%';
    document.getElementById('messagesSentMetric').textContent = messagesSent;
    document.getElementById('followupsMetric').textContent = totalFollowups;
    
    // Status Chart
    const statuses = ['New', 'Contacted', 'Interested', 'Converted', 'Lost'];
    const statusCounts = statuses.map(s => leads?.filter(l => l.status === s).length || 0);
    
    if (statusChartInstance) statusChartInstance.destroy();
    statusChartInstance = new Chart(document.getElementById('statusChart'), {
        type: 'doughnut',
        data: {
            labels: statuses,
            datasets: [{
                data: statusCounts,
                backgroundColor: ['#1976d2', '#f57c00', '#7b1fa2', '#388e3c', '#d32f2f']
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false
        }
    });
    
    // Growth Chart (Last 7 days)
    const growthLabels = [];
    const growthData = [];
    for (let i = 6; i >= 0; i--) {
        const date = new Date();
        date.setDate(date.getDate() - i);
        const dateStr = date.toISOString().split('T')[0];
        growthLabels.push(date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }));
        
        const count = leads?.filter(l => {
            const createdDate = l.created_at ? new Date(l.created_at).toISOString().split('T')[0] : null;
            return createdDate === dateStr;
        }).length || 0;
        
        growthData.push(count);
    }
    
    if (growthChartInstance) growthChartInstance.destroy();
    growthChartInstance = new Chart(document.getElementById('growthChart'), {
        type: 'bar',
        data: {
            labels: growthLabels,
            datasets: [{
                label: 'New Leads',
                data: growthData,
                backgroundColor: '#25D366',
                borderRadius: 5
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: { stepSize: 1 }
                }
            }
        }
    });
    
    // Activity Chart
    const activityTypes = ['Lead', 'WhatsApp', 'Template', 'Follow-up', 'Bulk'];
    const activityCounts = activityTypes.map(type => 
        activities?.filter(a => a.action.includes(type)).length || 0
    );
    
    if (activityChartInstance) activityChartInstance.destroy();
    activityChartInstance = new Chart(document.getElementById('activityChart'), {
        type: 'pie',
        data: {
            labels: activityTypes,
            datasets: [{
                data: activityCounts,
                backgroundColor: ['#1976d2', '#25D366', '#7b1fa2', '#f57c00', '#c2185b']
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false
        }
    });
    
    // Follow-up Chart
    const followupStatuses = ['Pending', 'Done', 'Missed'];
    const followupCounts = followupStatuses.map(s => 
        followups?.filter(f => f.status === s).length || 0
    );
    
    if (followupChartInstance) followupChartInstance.destroy();
    followupChartInstance = new Chart(document.getElementById('followupChart'), {
        type: 'bar',
        data: {
            labels: followupStatuses,
            datasets: [{
                label: 'Follow-ups',
                data: followupCounts,
                backgroundColor: ['#f57c00', '#388e3c', '#d32f2f'],
                borderRadius: 5
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: { stepSize: 1 }
                }
            }
        }
    });
    
    // Top Converted Leads
    const convertedLeadsList = leads?.filter(l => l.status === 'Converted').slice(0, 5) || [];
    
    if (convertedLeadsList.length > 0) {
        document.getElementById('topLeadsList').innerHTML = convertedLeadsList.map((lead, index) => `
            <div class="d-flex justify-content-between align-items-center mb-2">
                <div>
                    <strong>#${index + 1} ${lead.name}</strong>
                    <br><small class="text-muted">${lead.company || 'No company'}</small>
                </div>
                <span class="badge bg-success">Converted</span>
            </div>
        `).join('');
    } else {
        document.getElementById('topLeadsList').innerHTML = '<p class="text-muted">No converted leads yet</p>';
    }
    
    // Activity Summary
    const recentActivities = activities?.slice(0, 5) || [];
    
    if (recentActivities.length > 0) {
        document.getElementById('activitySummary').innerHTML = recentActivities.map(activity => `
            <div class="d-flex justify-content-between align-items-center mb-2">
                <div>
                    <strong>${activity.action}</strong>
                    <br><small class="text-muted">${new Date(activity.created_at).toLocaleString()}</small>
                </div>
            </div>
        `).join('');
    } else {
        document.getElementById('activitySummary').innerHTML = '<p class="text-muted">No recent activity</p>';
    }
}

loadAnalytics();
</script>
