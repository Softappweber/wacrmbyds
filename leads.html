<link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css">
<style>
    .status-badge {
        padding: 5px 10px;
        border-radius: 20px;  
        font-size: 12px;
    }
    .status-New { background-color: #e3f2fd; color: #1976d2; }
    .status-Contacted { background-color: #fff3e0; color: #f57c00; }
    .status-Interested { background-color: #f3e5f5; color: #7b1fa2; }
    .status-Converted { background-color: #e8f5e9; color: #388e3c; }
    .status-Lost { background-color: #ffebee; color: #d32f2f; }
    
    .lead-tag-badge {
        display: inline-block;
        padding: 3px 8px;
        border-radius: 12px;
        font-size: 11px;
        margin: 2px;
    }
    .tag-checkbox-group {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 5px;
    }
    .tag-checkbox-item {
        display: flex;
        align-items: center;
        gap: 4px;
        cursor: pointer;
        padding: 4px 10px;
        border-radius: 15px;
        font-size: 12px;
        transition: all 0.2s;
    }
    .tag-checkbox-item:hover {
        background-color: #f0f0f0;
    }
    .tag-checkbox-item.checked {
    background-color: #25D366 !important;
    color: white !important;
    font-weight: bold;
    border: 2px solid #128C7E;
    box-shadow: 0 2px 8px rgba(37, 211, 102, 0.4);
}
</style>

<div class="d-flex justify-content-between mb-3">
    <h3><i class="fas fa-users"></i> Leads Management</h3>
    <div>
        <button class="btn btn-outline-primary me-2" onclick="document.getElementById('csvInput').click()">
            <i class="fas fa-upload"></i> Import CSV
        </button>
        <input type="file" id="csvInput" accept=".csv" style="display:none;" onchange="importCSV(event)">
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addLeadModal">
            <i class="fas fa-plus"></i> Add Lead
        </button>
    </div>
</div>

<!-- Tag Filter -->
<div class="card mb-3">
    <div class="card-body">
        <div class="d-flex align-items-center gap-3 flex-wrap">
            <strong><i class="fas fa-filter"></i> Filter by Tag:</strong>
            <div id="tagFilterButtons" class="d-flex flex-wrap gap-2">
                <button class="btn btn-sm btn-outline-primary active" onclick="filterByTag('all', this)">All</button>
            </div>
        </div>
    </div>
</div>

<div class="card">
    <div class="card-body">
        <table id="leadsTable" class="table table-striped">
            <thead>
                <tr><th>Name</th><th>Phone</th><th>Email</th><th>Company</th><th>Status</th><th>Tags</th><th>Actions</th></tr>
            </thead>
            <tbody id="leadsTableBody"></tbody>
        </table>
    </div>
</div>

<!-- Add Lead Modal -->
<div class="modal fade" id="addLeadModal"><div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5>Add Lead</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
        <input type="text" id="leadName" class="form-control mb-3" placeholder="Name *">
        <input type="tel" id="leadPhone" class="form-control mb-3" placeholder="Phone *">
        <input type="email" id="leadEmail" class="form-control mb-3" placeholder="Email">
        <input type="text" id="leadCompany" class="form-control mb-3" placeholder="Company">
        <select id="leadStatus" class="form-select mb-3">
            <option>New</option><option>Contacted</option><option>Interested</option><option>Converted</option><option>Lost</option>
        </select>
        <label class="form-label">Tags</label>
        <div class="tag-checkbox-group" id="addLeadTags"></div>
    </div>
    <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" onclick="addLead()">Save</button>
    </div>
</div></div></div>

<!-- Edit Lead Modal -->
<div class="modal fade" id="editLeadModal"><div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5>Edit Lead</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
        <input type="hidden" id="editLeadId">
        <input type="text" id="editLeadName" class="form-control mb-3" placeholder="Name *">
        <input type="tel" id="editLeadPhone" class="form-control mb-3" placeholder="Phone *">
        <input type="email" id="editLeadEmail" class="form-control mb-3" placeholder="Email">
        <input type="text" id="editLeadCompany" class="form-control mb-3" placeholder="Company">
        <select id="editLeadStatus" class="form-select mb-3">
            <option>New</option><option>Contacted</option><option>Interested</option><option>Converted</option><option>Lost</option>
        </select>
        <label class="form-label">Tags</label>
        <div class="tag-checkbox-group" id="editLeadTags"></div>
    </div>
    <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" onclick="updateLead()">Update</button>
    </div>
</div></div></div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>

<script>
let leadsDataTable;
let allLeadsData = [];
let allTagsData = [];
let selectedAddTags = new Set();
let selectedEditTags = new Set();
let currentTagFilter = 'all';

async function loadTags() {
    const { data: { user } } = await window.supabase.auth.getUser();
    if (!user) return;
    
    const { data: tags } = await window.supabase
        .from('tags')
        .select('*')
        .eq('user_id', user.id)
        .order('name');
    
    allTagsData = tags || [];
    
    // Populate tag filter buttons
    const filterDiv = document.getElementById('tagFilterButtons');
    filterDiv.innerHTML = '<button class="btn btn-sm btn-outline-primary active" onclick="filterByTag(\'all\', this)">All</button>' +
        allTagsData.map(tag => `
            <button class="btn btn-sm btn-outline-primary" onclick="filterByTag('${tag.name}', this)" style="border-color: ${tag.color}; color: ${tag.color};">
                ${tag.name}
            </button>
        `).join('');
    
    // Populate Add Lead tag checkboxes
    document.getElementById('addLeadTags').innerHTML = allTagsData.map(tag => `
        <div class="tag-checkbox-item" id="addTagItem${tag.id}" onclick="toggleAddTag(${tag.id})">
            <span style="width: 8px; height: 8px; border-radius: 50%; background-color: ${tag.color}; display: inline-block;"></span>
            ${tag.name}
        </div>
    `).join('');
}

function toggleAddTag(tagId) {
    const tag = allTagsData.find(t => t.id === tagId);
    const element = document.getElementById('addTagItem' + tagId);
    
    if (selectedAddTags.has(tag.name)) {
        selectedAddTags.delete(tag.name);
        element.classList.remove('checked');
    } else {
        selectedAddTags.add(tag.name);
        element.classList.add('checked');
    }
}

function toggleEditTag(tagId) {
    const tag = allTagsData.find(t => t.id === tagId);
    const element = document.getElementById('editTagItem' + tagId);
    
    if (selectedEditTags.has(tag.name)) {
        selectedEditTags.delete(tag.name);
        element.classList.remove('checked');
    } else {
        selectedEditTags.add(tag.name);
        element.classList.add('checked');
    }
}

async function loadLeads() {
    const { data: { user } } = await window.supabase.auth.getUser();
    if (!user) return;
    
    const { data: leads } = await window.supabase
        .from('leads')
        .select('*')
        .eq('user_id', user.id)
        .order('created_at', { ascending: false });
    
    allLeadsData = leads || [];
    displayLeads(allLeadsData);
}

function displayLeads(leads) {
    const html = leads.map(lead => {
        const leadTags = lead.tags ? lead.tags.split(',').map(t => t.trim()).filter(t => t) : [];
        
        const tagBadges = leadTags.map(tagName => {
            const tagObj = allTagsData.find(t => t.name === tagName);
            const color = tagObj ? tagObj.color : '#666';
            return `<span class="lead-tag-badge" style="background-color: ${color}20; color: ${color}; border: 1px solid ${color}40;">${tagName}</span>`;
        }).join('');
        
        return `
            <tr>
                <td>${lead.name}</td>
                <td>${lead.phone}</td>
                <td>${lead.email || '-'}</td>
                <td>${lead.company || '-'}</td>
                <td><span class="status-badge status-${lead.status}">${lead.status}</span></td>
                <td>${tagBadges || '-'}</td>
                <td>
                    <button class="btn btn-sm btn-success" onclick="openWhatsApp('${lead.phone}')"><i class="fab fa-whatsapp"></i></button>
                    <button class="btn btn-sm btn-primary" onclick="editLead(${lead.id})"><i class="fas fa-edit"></i></button>
                    <button class="btn btn-sm btn-danger" onclick="deleteLead(${lead.id})"><i class="fas fa-trash"></i></button>
                </td>
            </tr>
        `;
    }).join('');
    
    document.getElementById('leadsTableBody').innerHTML = html;
    if (leadsDataTable) leadsDataTable.destroy();
    leadsDataTable = $('#leadsTable').DataTable();
}

window.filterByTag = function(tagName, button) {
    currentTagFilter = tagName;
    
    document.querySelectorAll('#tagFilterButtons .btn').forEach(b => b.classList.remove('active'));
    button.classList.add('active');
    
    if (tagName === 'all') {
        displayLeads(allLeadsData);
        return;
    }
    
    const filtered = allLeadsData.filter(lead => 
        lead.tags && lead.tags.split(',').map(t => t.trim()).includes(tagName)
    );
    
    displayLeads(filtered);
};

window.addLead = async function() {
    const { data: { user } } = await window.supabase.auth.getUser();
    if (!user) return;
    
    const tagsString = Array.from(selectedAddTags).join(', ');
    
    const { error } = await window.supabase.from('leads').insert([{
        user_id: user.id,
        name: document.getElementById('leadName').value,
        phone: document.getElementById('leadPhone').value,
        email: document.getElementById('leadEmail').value,
        company: document.getElementById('leadCompany').value,
        status: document.getElementById('leadStatus').value,
        tags: tagsString
    }]);
    
    if (error) { alert(error.message); } else {
        // Hide modal manually
        document.getElementById('addLeadModal').classList.remove('show');
        document.getElementById('addLeadModal').style.display = 'none';
        document.body.classList.remove('modal-open');
        document.querySelector('.modal-backdrop')?.remove();
        
        // Clear form
        document.getElementById('leadName').value = '';
        document.getElementById('leadPhone').value = '';
        document.getElementById('leadEmail').value = '';
        document.getElementById('leadCompany').value = '';
        selectedAddTags.clear();
        document.querySelectorAll('#addLeadTags .tag-checkbox-item').forEach(el => el.classList.remove('checked'));
        
        loadLeads();
    }
};
window.editLead = async function(id) {
    const { data: lead } = await window.supabase.from('leads').select('*').eq('id', id).single();
    if (lead) {
        document.getElementById('editLeadId').value = lead.id;
        document.getElementById('editLeadName').value = lead.name;
        document.getElementById('editLeadPhone').value = lead.phone;
        document.getElementById('editLeadEmail').value = lead.email || '';
        document.getElementById('editLeadCompany').value = lead.company || '';
        document.getElementById('editLeadStatus').value = lead.status;
        
        // Populate edit tag checkboxes
        selectedEditTags.clear();
        const leadTags = lead.tags ? lead.tags.split(',').map(t => t.trim()) : [];
        leadTags.forEach(t => selectedEditTags.add(t));
        
        document.getElementById('editLeadTags').innerHTML = allTagsData.map(tag => `
            <div class="tag-checkbox-item ${selectedEditTags.has(tag.name) ? 'checked' : ''}" id="editTagItem${tag.id}" onclick="toggleEditTag(${tag.id})">
                <span style="width: 8px; height: 8px; border-radius: 50%; background-color: ${tag.color}; display: inline-block;"></span>
                ${tag.name}
            </div>
        `).join('');
        
        $('#editLeadModal').modal('show');
    }
};

window.updateLead = async function() {
    const id = document.getElementById('editLeadId').value;
    const tagsString = Array.from(selectedEditTags).join(', ');
    
    const { error } = await window.supabase.from('leads').update({
        name: document.getElementById('editLeadName').value,
        phone: document.getElementById('editLeadPhone').value,
        email: document.getElementById('editLeadEmail').value,
        company: document.getElementById('editLeadCompany').value,
        status: document.getElementById('editLeadStatus').value,
        tags: tagsString
    }).eq('id', id);
    
    if (error) { alert(error.message); } else {
        $('#editLeadModal').modal('hide');
        loadLeads();
    }
};

window.deleteLead = async function(id) {
    if (confirm('Delete this lead?')) {
        await window.supabase.from('leads').delete().eq('id', id);
        loadLeads();
    }
};

window.openWhatsApp = function(phone) {
    window.open('https://wa.me/' + phone.replace(/[^0-9]/g, ''), '_blank');
};

window.importCSV = function(event) {
    const file = event.target.files[0];
    const reader = new FileReader();
    reader.onload = async function(e) {
        const lines = e.target.result.split('\n');
        const { data: { user } } = await window.supabase.auth.getUser();
        for (let i = 1; i < lines.length; i++) {
            if (!lines[i].trim()) continue;
            const v = lines[i].split(',');
            await window.supabase.from('leads').insert([{
                user_id: user.id,
                name: v[0]?.trim() || '',
                phone: v[1]?.trim() || '',
                email: v[2]?.trim() || '',
                company: v[3]?.trim() || '',
                status: v[4]?.trim() || 'New',
                tags: v[5]?.trim() || ''
            }]);
        }
        loadLeads();
        alert('CSV imported!');
    };
    reader.readAsText(file);
};

// Initialize
loadTags();
loadLeads();
</script>
