<style>
    .tag-badge {
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 13px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin: 4px;
        cursor: pointer;
        transition: all 0.2s;
    }
    .tag-badge:hover {
        transform: scale(1.05);
        box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .tag-color-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        display: inline-block;
    }
    .tag-count {
        background: rgba(0,0,0,0.1);
        padding: 2px 8px;
        border-radius: 10px;
        font-size: 11px;
    }
    .color-picker {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 10px;
    }
    .color-option {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        cursor: pointer;
        border: 2px solid transparent;
        transition: all 0.2s;
    }
    .color-option:hover {
        transform: scale(1.2);
    }
    .color-option.selected {
        border-color: #2c3e50;
        box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }
    .assign-lead-item {
        padding: 8px;
        border-bottom: 1px solid #f0f0f0;
        cursor: pointer;
        border-radius: 5px;
    }
    .assign-lead-item:hover {
        background-color: #f8f9fa;
    }
    .assign-lead-item.selected {
        background-color: #e8f5e9;
    }
</style>

<div class="d-flex justify-content-between mb-3">
    <h3><i class="fas fa-tags"></i> Tag Management</h3>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addTagModal">
        <i class="fas fa-plus"></i> Create Tag
    </button>
</div>

<!-- Tags Grid -->
<div class="card mb-4">
    <div class="card-body">
        <div id="tagsList" class="d-flex flex-wrap"></div>
    </div>
</div>

<!-- Leads by Tag -->
<div class="card">
    <div class="card-header">
        <h5 class="mb-0">Filter Leads by Tag</h5>
    </div>
    <div class="card-body">
        <div class="mb-3">
            <select id="tagFilter" class="form-select" onchange="filterLeadsByTag()">
                <option value="">All Tags</option>
            </select>
        </div>
        <div id="taggedLeadsList"></div>
    </div>
</div>

<!-- Add Tag Modal -->
<div class="modal fade" id="addTagModal"><div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5>Create Tag</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
        <div class="mb-3">
            <label class="form-label">Tag Name *</label>
            <input type="text" id="tagName" class="form-control" placeholder="e.g., VIP, Hot Lead, Follow-up">
        </div>
        <div class="mb-3">
            <label class="form-label">Color</label>
            <div class="color-picker" id="colorPicker"></div>
            <input type="hidden" id="selectedColor" value="#25D366">
        </div>
    </div>
    <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" onclick="addTag()">Create</button>
    </div>
</div></div></div>

<!-- Edit Tag Modal -->
<div class="modal fade" id="editTagModal"><div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5>Edit Tag</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
        <input type="hidden" id="editTagId">
        <div class="mb-3">
            <label class="form-label">Tag Name *</label>
            <input type="text" id="editTagName" class="form-control">
        </div>
        <div class="mb-3">
            <label class="form-label">Color</label>
            <div class="color-picker" id="editColorPicker"></div>
            <input type="hidden" id="editSelectedColor" value="#25D366">
        </div>
    </div>
    <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" onclick="updateTag()">Update</button>
    </div>
</div></div></div>

<!-- Assign Tag Modal -->
<div class="modal fade" id="assignTagModal"><div class="modal-dialog modal-lg"><div class="modal-content">
    <div class="modal-header"><h5>Assign Tag to Leads</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
        <input type="hidden" id="assignTagId">
        <p>Select leads to assign tag: <strong id="assignTagName"></strong></p>
        <input type="text" id="assignLeadSearch" class="form-control mb-3" placeholder="Search leads..." onkeyup="filterAssignLeads()">
        <div id="assignLeadsList" style="max-height: 400px; overflow-y: auto;"></div>
    </div>
    <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" onclick="assignTagToLeads()">Assign</button>
    </div>
</div></div></div>

<script>
const tagColors = [
    '#25D366', '#128C7E', '#1976d2', '#f57c00', '#7b1fa2',
    '#388e3c', '#d32f2f', '#c2185b', '#0097a7', '#5d4037',
    '#303f9f', '#e64a19', '#00796b', '#455a64', '#fbc02d'
];

let allTags = [];
let allLeads = [];
let assignSelectedLeads = new Set();

function renderColorPicker(containerId, hiddenInputId, selectedColor) {
    const container = document.getElementById(containerId);
    container.innerHTML = tagColors.map(color => `
        <div class="color-option ${color === selectedColor ? 'selected' : ''}" 
             style="background-color: ${color};" 
             onclick="selectColor('${color}', '${hiddenInputId}', this)"></div>
    `).join('');
}

window.selectColor = function(color, hiddenInputId, element) {
    document.getElementById(hiddenInputId).value = color;
    element.parentElement.querySelectorAll('.color-option').forEach(c => c.classList.remove('selected'));
    element.classList.add('selected');
};

async function loadTags() {
    const { data: { user } } = await window.supabase.auth.getUser();
    if (!user) return;
    
    const [tagsResult, leadsResult] = await Promise.all([
        window.supabase.from('tags').select('*').eq('user_id', user.id).order('name'),
        window.supabase.from('leads').select('*').eq('user_id', user.id)
    ]);
    
    allTags = tagsResult.data || [];
    allLeads = leadsResult.data || [];
    
    displayTags();
    populateTagFilter();
}

function displayTags() {
    if (allTags.length === 0) {
        document.getElementById('tagsList').innerHTML = `
            <div class="text-center w-100 py-4">
                <i class="fas fa-tags fa-3x text-muted mb-3"></i>
                <h6>No tags yet</h6>
                <p class="text-muted">Create tags to organize your leads</p>
            </div>
        `;
        return;
    }
    
    document.getElementById('tagsList').innerHTML = allTags.map(tag => {
        const taggedLeads = allLeads.filter(lead => 
            lead.tags && lead.tags.split(',').map(t => t.trim()).includes(tag.name)
        );
        
        return `
            <div class="tag-badge" style="background-color: ${tag.color}20; color: ${tag.color}; border: 1px solid ${tag.color}40;">
                <span class="tag-color-dot" style="background-color: ${tag.color};"></span>
                ${tag.name}
                <span class="tag-count">${taggedLeads.length}</span>
                <button class="btn btn-sm p-0 ms-1" onclick="openAssignModal(${tag.id})" title="Assign to Leads" style="color: ${tag.color};">
                    <i class="fas fa-user-plus" style="font-size: 11px;"></i>
                </button>
                <button class="btn btn-sm p-0 ms-1" onclick="editTag(${tag.id})" title="Edit" style="color: ${tag.color};">
                    <i class="fas fa-edit" style="font-size: 11px;"></i>
                </button>
                <button class="btn btn-sm p-0 ms-1" onclick="deleteTag(${tag.id})" title="Delete" style="color: #d32f2f;">
                    <i class="fas fa-trash" style="font-size: 11px;"></i>
                </button>
            </div>
        `;
    }).join('');
}

function populateTagFilter() {
    const select = document.getElementById('tagFilter');
    select.innerHTML = '<option value="">All Tags</option>' + 
        allTags.map(tag => `<option value="${tag.name}">${tag.name}</option>`).join('');
}

window.addTag = async function() {
    const { data: { user } } = await window.supabase.auth.getUser();
    if (!user) return;
    
    const tagName = document.getElementById('tagName').value.trim();
    const color = document.getElementById('selectedColor').value;
    
    if (!tagName) {
        alert('Please enter tag name');
        return;
    }
    
    const { error } = await window.supabase.from('tags').insert([{
        user_id: user.id,
        name: tagName,
        color: color
    }]);
    
    if (error) {
        alert('Failed to create tag: ' + error.message);
    } else {
        $('#addTagModal').modal('hide');
        document.getElementById('tagName').value = '';
        loadTags();
    }
};

window.editTag = function(id) {
    const tag = allTags.find(t => t.id === id);
    if (tag) {
        document.getElementById('editTagId').value = tag.id;
        document.getElementById('editTagName').value = tag.name;
        document.getElementById('editSelectedColor').value = tag.color;
        renderColorPicker('editColorPicker', 'editSelectedColor', tag.color);
        $('#editTagModal').modal('show');
    }
};

window.updateTag = async function() {
    const id = document.getElementById('editTagId').value;
    const tagName = document.getElementById('editTagName').value.trim();
    const color = document.getElementById('editSelectedColor').value;
    
    const { error } = await window.supabase.from('tags').update({
        name: tagName,
        color: color
    }).eq('id', id);
    
    if (error) {
        alert('Failed to update: ' + error.message);
    } else {
        $('#editTagModal').modal('hide');
        loadTags();
    }
};

window.deleteTag = async function(id) {
    if (confirm('Delete this tag?')) {
        await window.supabase.from('tags').delete().eq('id', id);
        loadTags();
    }
};

// Assign Tag Functions
window.openAssignModal = function(tagId) {
    const tag = allTags.find(t => t.id === tagId);
    if (!tag) return;
    
    assignSelectedLeads.clear();
    document.getElementById('assignTagId').value = tagId;
    document.getElementById('assignTagName').textContent = tag.name;
    document.getElementById('assignLeadSearch').value = '';
    
    displayAssignLeads(allLeads);
    $('#assignTagModal').modal('show');
};

function displayAssignLeads(leads) {
    if (leads.length === 0) {
        document.getElementById('assignLeadsList').innerHTML = '<p class="text-muted">No leads found</p>';
        return;
    }
    
    document.getElementById('assignLeadsList').innerHTML = leads.map(lead => {
        const isAssigned = lead.tags && lead.tags.split(',').map(t => t.trim()).includes(
            allTags.find(t => t.id === parseInt(document.getElementById('assignTagId').value))?.name
        );
        
        if (isAssigned) assignSelectedLeads.add(lead.id);
        
        return `
            <div class="assign-lead-item ${assignSelectedLeads.has(lead.id) ? 'selected' : ''}" id="assignLead${lead.id}" onclick="toggleAssignLead(${lead.id})">
                <input type="checkbox" ${assignSelectedLeads.has(lead.id) ? 'checked' : ''} onchange="toggleAssignLead(${lead.id})">
                <strong>${lead.name}</strong> - ${lead.phone}
                ${isAssigned ? '<span class="badge bg-success ms-2">Already tagged</span>' : ''}
            </div>
        `;
    }).join('');
}

window.toggleAssignLead = function(leadId) {
    if (assignSelectedLeads.has(leadId)) {
        assignSelectedLeads.delete(leadId);
    } else {
        assignSelectedLeads.add(leadId);
    }
    document.getElementById('assignLead' + leadId).classList.toggle('selected');
};

window.filterAssignLeads = function() {
    const search = document.getElementById('assignLeadSearch').value.toLowerCase();
    const filtered = allLeads.filter(lead => 
        lead.name.toLowerCase().includes(search) || 
        lead.phone.includes(search)
    );
    displayAssignLeads(filtered);
};

window.assignTagToLeads = async function() {
    const tagId = parseInt(document.getElementById('assignTagId').value);
    const tag = allTags.find(t => t.id === tagId);
    
    if (!tag || assignSelectedLeads.size === 0) {
        alert('Please select at least one lead');
        return;
    }
    
    for (const leadId of assignSelectedLeads) {
        const lead = allLeads.find(l => l.id === leadId);
        if (!lead) continue;
        
        let existingTags = lead.tags ? lead.tags.split(',').map(t => t.trim()).filter(t => t) : [];
        
        if (!existingTags.includes(tag.name)) {
            existingTags.push(tag.name);
        }
        
        await window.supabase.from('leads').update({
            tags: existingTags.join(', ')
        }).eq('id', leadId);
    }
    
    $('#assignTagModal').modal('hide');
    alert('Tag assigned successfully!');
    loadTags();
};

window.filterLeadsByTag = function() {
    const selectedTag = document.getElementById('tagFilter').value;
    
    if (!selectedTag) {
        document.getElementById('taggedLeadsList').innerHTML = '<p class="text-muted">Select a tag to see leads</p>';
        return;
    }
    
    const filteredLeads = allLeads.filter(lead => 
        lead.tags && lead.tags.split(',').map(t => t.trim()).includes(selectedTag)
    );
    
    if (filteredLeads.length === 0) {
        document.getElementById('taggedLeadsList').innerHTML = '<p class="text-muted">No leads with this tag</p>';
        return;
    }
    
    document.getElementById('taggedLeadsList').innerHTML = `
        <table class="table table-striped">
            <thead>
                <tr><th>Name</th><th>Phone</th><th>Company</th><th>Status</th><th>Tags</th><th>Remove Tag</th></tr>
            </thead>
            <tbody>
                ${filteredLeads.map(lead => `
                    <tr>
                        <td>${lead.name}</td>
                        <td>${lead.phone}</td>
                        <td>${lead.company || '-'}</td>
                        <td>${lead.status}</td>
                        <td>${lead.tags || '-'}</td>
                        <td>
                            <button class="btn btn-sm btn-danger" onclick="removeTagFromLead(${lead.id}, '${selectedTag}')">
                                <i class="fas fa-times"></i>
                            </button>
                        </td>
                    </tr>
                `).join('')}
            </tbody>
        </table>
    `;
};

window.removeTagFromLead = async function(leadId, tagName) {
    const lead = allLeads.find(l => l.id === leadId);
    if (!lead) return;
    
    let tags = lead.tags.split(',').map(t => t.trim()).filter(t => t !== tagName);
    
    await window.supabase.from('leads').update({
        tags: tags.join(', ')
    }).eq('id', leadId);
    
    loadTags();
    filterLeadsByTag();
};

renderColorPicker('colorPicker', 'selectedColor', '#25D366');
loadTags();
</script>
