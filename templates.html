<style>
    .template-card {
        cursor: pointer;
        transition: transform 0.2s;
        height: 100%;
    }
    .template-card:hover {
        transform: translateY(-5px);
    }
    .template-content {
        max-height: 100px;
        overflow-y: auto;
        background-color: #f8f9fa;
        padding: 10px;
        border-radius: 5px;
        font-size: 14px;
    }
    .badge-category {
        background-color: #e3f2fd;
        color: #1976d2;
        padding: 4px 10px;
        border-radius: 15px;
        font-size: 12px;
    }
</style>

<div class="d-flex justify-content-between mb-3">
    <h3>Message Templates</h3>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addTemplateModal">
        <i class="fas fa-plus"></i> Add Template
    </button>
</div>

<div class="row" id="templatesList">
    <!-- Templates load here -->
</div>

<!-- Add Template Modal -->
<div class="modal fade" id="addTemplateModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add Template</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">Template Name *</label>
                    <input type="text" id="templateName" class="form-control" placeholder="e.g., Welcome Message">
                </div>
                <div class="mb-3">
                    <label class="form-label">Category</label>
                    <input type="text" id="templateCategory" class="form-control" placeholder="e.g., Sales, Support, Follow-up">
                </div>
                <div class="mb-3">
                    <label class="form-label">Message Content *</label>
                    <textarea id="templateContent" class="form-control" rows="6" placeholder="Hi {name}, welcome to {company}!"></textarea>
                    <small class="text-muted">Use variables: {name}, {company}, {email}, {phone}</small>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="addTemplate()">Save Template</button>
            </div>
        </div>
    </div>
</div>

<!-- Edit Template Modal -->
<div class="modal fade" id="editTemplateModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Edit Template</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editTemplateId">
                <div class="mb-3">
                    <label class="form-label">Template Name *</label>
                    <input type="text" id="editTemplateName" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Category</label>
                    <input type="text" id="editTemplateCategory" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Message Content *</label>
                    <textarea id="editTemplateContent" class="form-control" rows="6"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="updateTemplate()">Update</button>
            </div>
        </div>
    </div>
</div>

<script>
    async function loadTemplates() {
        const { data: { user } } = await window.supabase.auth.getUser();
        if (!user) return;
        
        const { data: templates } = await window.supabase
            .from('templates')
            .select('*')
            .eq('user_id', user.id)
            .order('created_at', { ascending: false });
        
        if (templates && templates.length > 0) {
            const html = templates.map(template => `
                <div class="col-md-4 mb-4">
                    <div class="card template-card">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <h5 class="mb-0">${template.name}</h5>
                                <span class="badge-category">${template.category || 'General'}</span>
                            </div>
                            <div class="template-content mb-3">${template.content}</div>
                            <div class="d-flex justify-content-between">
                                <button class="btn btn-sm btn-success" onclick="useTemplate('${template.id}')">
                                    <i class="fab fa-whatsapp"></i> Use
                                </button>
                                <div>
                                    <button class="btn btn-sm btn-primary" onclick="editTemplate(${template.id})">
                                        <i class="fas fa-edit"></i>
                                    </button>
                                    <button class="btn btn-sm btn-danger" onclick="deleteTemplate(${template.id})">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
            
            document.getElementById('templatesList').innerHTML = html;
        } else {
            document.getElementById('templatesList').innerHTML = `
                <div class="col-12 text-center py-5">
                    <i class="fas fa-envelope-open-text fa-3x text-muted mb-3"></i>
                    <h5>No templates yet</h5>
                    <p class="text-muted">Create your first message template to get started</p>
                </div>
            `;
        }
    }
    
    window.addTemplate = async function() {
        const { data: { user } } = await window.supabase.auth.getUser();
        if (!user) return;
        
        const templateData = {
            user_id: user.id,
            name: document.getElementById('templateName').value,
            category: document.getElementById('templateCategory').value,
            content: document.getElementById('templateContent').value
        };
        
        const { error } = await window.supabase.from('templates').insert([templateData]);
        
        if (error) {
            alert('Failed to add template: ' + error.message);
        } else {
            $('#addTemplateModal').modal('hide');
            document.getElementById('templateName').value = '';
            document.getElementById('templateCategory').value = '';
            document.getElementById('templateContent').value = '';
            loadTemplates();
        }
    };
    
    window.editTemplate = async function(id) {
        const { data: template } = await window.supabase
            .from('templates')
            .select('*')
            .eq('id', id)
            .single();
        
        if (template) {
            document.getElementById('editTemplateId').value = template.id;
            document.getElementById('editTemplateName').value = template.name;
            document.getElementById('editTemplateCategory').value = template.category || '';
            document.getElementById('editTemplateContent').value = template.content;
            $('#editTemplateModal').modal('show');
        }
    };
    
    window.updateTemplate = async function() {
        const id = document.getElementById('editTemplateId').value;
        const templateData = {
            name: document.getElementById('editTemplateName').value,
            category: document.getElementById('editTemplateCategory').value,
            content: document.getElementById('editTemplateContent').value
        };
        
        const { error } = await window.supabase.from('templates').update(templateData).eq('id', id);
        
        if (error) {
            alert('Failed to update: ' + error.message);
        } else {
            $('#editTemplateModal').modal('hide');
            loadTemplates();
        }
    };
    
    window.deleteTemplate = async function(id) {
        if (confirm('Delete this template?')) {
            const { error } = await window.supabase.from('templates').delete().eq('id', id);
            if (error) {
                alert('Failed to delete: ' + error.message);
            } else {
                loadTemplates();
            }
        }
    };
    
    window.useTemplate = function(id) {
        // Navigate to WhatsApp feature and pass template ID
        window.loadFeature('whatsapp.html');
        setTimeout(() => {
            if (window.loadTemplateForUse) {
                window.loadTemplateForUse(id);
            }
        }, 500);
    };
    
    // Load templates when feature loads
    loadTemplates();
</script>
